<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overhead Chat keyboard settings</title>
  <link rel="stylesheet" href="./keyboard.css?v=2.11.4">
  <script type="module" src="./keyboard-editor.js?v=2.11.16"></script>
</head>
<body>
  <main>
    <header>
      <div><h1>Keyboard settings</h1><p>Drag an action to a key, or select it and press a key without modifiers. Modifier shortcuts follow the base key.</p></div>
      <button id="close" type="button" aria-label="Close keyboard settings">✕</button>
    </header>
    <div class="editor">
      <section class="board-panel" aria-label="Keyboard layout">
        <div class="toolbar">
          <div id="modifiers" aria-label="View keyboard layers"></div>
          <button id="reset" type="button">Reset bindings</button>
        </div>
        <div id="board" aria-label="ANSI keyboard"></div>
        <div class="international"><span>International keys</span><div id="international-keys"></div></div>
        <div id="selection" class="selection" aria-label="Selected action"></div>
        <p id="feedback" role="status" aria-live="polite"></p>
      </section>
      <aside id="sidebar" aria-labelledby="sidebar-title">
        <h2 id="sidebar-title">Unassigned</h2>
        <div id="binding-filters">
          <label class="filter-label">Find actions <input id="filter" type="search" placeholder="Search"></label>
          <label class="show-all"><input id="show-all" type="checkbox"> Show assigned actions too</label>
        </div>
        <div id="actions"></div>
      </aside>
    </div>
  </main>
</body>
</html>
