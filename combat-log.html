<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>combat log</title>
  <link rel="stylesheet" href="./combat-log.css?v=2.9.3">
  <script type="module" src="./combat-log-panel.js?v=2.9.3"></script>
</head>
<body>
  <header><h1>combat log</h1><button id="combat-close" type="button" aria-label="close combat log">×</button></header>
  <main id="combat-transcript" role="log" aria-label="combat results">
    <p id="combat-empty">No combat yet.</p>
    <ol id="combat-entries"></ol>
  </main>
  <dialog id="custom-damage" aria-labelledby="custom-label">
    <form method="dialog">
      <label id="custom-label" for="custom-amount">custom damage</label>
      <input id="custom-amount" type="number" min="0" step="1" required autofocus>
      <div>
        <button type="submit" value="apply">apply</button>
        <button type="submit" value="cancel" formnovalidate>cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
